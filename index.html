<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* MÀU CHÍNH CỦA APP – đổi theo logo công ty chỉ cần sửa 4 dòng --pri* này */
  --pri:#0e7c74; --pri2:#0a5f58; --pri-soft:#e1f2ef; --pri-light:#2fb0a4;
  --bg:#f4f6f6; --card:#fff; --ink:#13201f; --muted:#667574; --line:#e4e9e9;
  --ok:#14915a; --ok-soft:#e5f6ee; --warn:#c77700; --warn-soft:#fff3df;
  --bad:#cf2e2e; --bad-soft:#fdeaea; --grey-soft:#eef1f5;
  --r:18px; --shadow:0 1px 2px rgba(16,40,38,.04),0 3px 12px rgba(16,40,38,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
h2{font-size:18px} h3{font-size:15px}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center} .wrap{flex-wrap:wrap} .grow{flex:1} .between{justify-content:space-between}
.mt{margin-top:12px} .mt2{margin-top:20px} .mb{margin-bottom:12px}
.right{text-align:right} .center{text-align:center} .nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* Buttons & inputs */
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:42px}
.btn:hover{background:var(--pri2)} .btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:var(--pri-soft);color:var(--pri)} .btn.ghost:hover{background:#d6e6f8}
.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line)} .btn.light:hover{background:#f7f9fc}
.btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)} .btn.sm{padding:6px 10px;min-height:32px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:500}
input.i,select.i,textarea.i{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:42px;outline:none}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
textarea.i{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.chk input{width:18px;height:18px}

/* Layout */
.top{background:rgba(244,246,246,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink);padding:12px 16px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.top .co{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who{font-weight:700;font-size:16px}
.top .btn{white-space:nowrap;flex:none;min-height:34px;padding:6px 12px;font-size:13px}
main{max-width:1100px;margin:0 auto;padding:14px 14px 96px}
/* Menu trái cho Quản trị trên máy tính */
#side{display:none}
.sd-brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.sd-brand .lg{width:34px;height:34px;border-radius:10px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.sd-grp{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#98a2b3;margin:14px 18px 4px}
.sd-it{display:flex;align-items:center;gap:10px;margin:1px 8px;padding:8px 10px;border-radius:9px;cursor:pointer;color:#475467;font-size:14px;font-weight:500;border:0;background:none;width:calc(100% - 16px);text-align:left}
.sd-it svg{width:19px;height:19px;flex:none}
.sd-it:hover{background:#f2f4f7}
.sd-it.on{background:var(--pri-soft);color:var(--pri);font-weight:700}
.sd-n{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:0 7px;line-height:18px}
.sd-n:empty{display:none}
.nav .nb{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:9px;font-size:10px;font-weight:700;padding:0 5px;line-height:16px}
.nav .nb:empty{display:none}
.nav button{position:relative}
.hdmine{display:none;flex:none;background:var(--pri);color:#fff;border:0;border-radius:20px;padding:0 14px;height:40px;font-weight:600;cursor:pointer;align-items:center;gap:6px}
.hdmine svg{width:18px;height:18px}
@media (min-width:900px){
  body.has-side #side{display:block;position:fixed;left:0;top:0;bottom:0;width:236px;background:#fff;border-right:1px solid var(--line);overflow:auto;z-index:25;padding-bottom:20px}
  body.has-side .top{margin-left:236px}
  body.has-side main{margin-left:236px;max-width:none;padding:18px 28px 40px}
  body.has-side .nav{display:none}
  body.has-side .hdmine{display:inline-flex}
  body.has-side #toast{bottom:30px}
}
/* Tổng quan: tiến độ kỳ lương + việc cần làm */
.ky{display:flex;gap:6px;margin:8px 0 4px;flex-wrap:wrap}
.ky div{flex:1;min-width:92px;border-radius:10px;padding:8px 8px;background:var(--grey-soft);color:var(--muted);font-size:12.5px;font-weight:600;text-align:center;line-height:1.3}
.ky div small{display:block;font-weight:500;font-size:11px}
.ky .xong{background:var(--ok-soft);color:var(--ok)}
.ky .dang{background:var(--pri);color:#fff}
.todo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.todo{grid-template-columns:repeat(2,minmax(0,1fr))}}
.todo .td{border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:#fff}
.todo .td:hover{border-color:#b9c4d4;box-shadow:var(--shadow)}
.todo .td b{display:block;font-size:26px;line-height:1.15}
.todo .td span{font-size:13px;color:var(--muted)}
.todo .td.zero b{color:#c3cad5}
.more-it{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:500}
.more-it svg{width:21px;height:21px;color:var(--pri)}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);padding:16px;margin-bottom:14px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--pri);font-weight:600}
.nav button.fab{flex:none;width:76px;padding-top:0;color:var(--pri);font-weight:600}
.nav button.fab .fb{width:58px;height:58px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-24px;border:4px solid #fff;box-shadow:0 6px 16px rgba(14,124,116,.35)}
.nav button.fab .fb svg{width:28px;height:28px}
.nav button.fab.on .fb{background:var(--pri2)}
.hdav{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--pri-soft);color:var(--pri);font-weight:700;font-size:14px;cursor:pointer}
.hdbell{flex:none;position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.hdbell svg{width:21px;height:21px}
.hdbell b{position:absolute;top:-3px;right:-4px;background:#ff3b30;color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:9px;padding:0 4px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.tb{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;background:#fff;position:relative}
.tb.new{border-color:#9cc3ec;background:#f5f9ff}
.tb.new::before{content:"";position:absolute;left:-1px;top:14px;width:4px;height:22px;border-radius:0 3px 3px 0;background:var(--pri)}
.tb.imp.new::before{background:var(--bad)}
.tb .tt{font-weight:700;font-size:15px}
.tb .nd{white-space:pre-wrap;font-size:14px;margin-top:6px;color:var(--ink)}
.tb .nd.cut{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted)}
.role-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.role-card h3{display:flex;align-items:center;gap:8px}
/* Bảng công dạng lịch (nhân viên) */
.bc-hero{background:var(--pri);color:#fff;border-radius:20px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.bc-mon{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.15);border-radius:10px;padding:2px}
.bc-mon button{border:0;background:none;color:#fff;font:inherit;font-size:18px;width:32px;height:32px;cursor:pointer;border-radius:8px}
.bc-mon b{font-size:15px;padding:0 4px}
.bc-big{font-size:40px;font-weight:700;line-height:1.1}
.bc-bar{height:6px;background:rgba(255,255,255,.2);border-radius:3px;margin:6px 0 12px;overflow:hidden}
.bc-bar i{display:block;height:100%;background:#fff;border-radius:3px}
.bc-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bc-chips div{background:rgba(255,255,255,.12);border-radius:10px;padding:7px 10px;font-size:12px;opacity:.95}
.bc-chips b{display:block;font-size:17px}
.bc-warn{margin-top:10px;background:#fff;color:var(--bad);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.bc-ok{margin-top:10px;font-size:13px;opacity:.9}
.bc-lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.bc-lg span{display:inline-flex;align-items:center;gap:5px}
.bc-lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.bc-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px 4px}
.bc-dw{text-align:center;font-size:12.5px;font-weight:600;color:var(--muted);padding:4px 0}
.bc-d{border-radius:10px;padding:3px 3px 6px;cursor:pointer;position:relative;border:2px solid transparent;min-height:66px}
.bc-d.sel{border-color:var(--pri);background:var(--pri-soft)}
.bc-d.today .bc-n{color:var(--pri)}
.bc-n{text-align:center;font-weight:700;font-size:15px;margin-bottom:2px}
.bc-n.sun{color:var(--bad)}
.bc-d.fut .bc-n{color:#b3bccb}
.bc-p{display:flex;justify-content:space-between;align-items:center;border-radius:5px;font-size:11px;font-weight:700;padding:0 4px;height:15px;margin-top:3px;color:#fff;line-height:15px}
.bc-p.ok{background:#14915a}.bc-p.wa{background:#e08a00}.bc-p.er{background:var(--bad)}.bc-p.mu{background:var(--grey-soft);color:#9aa3b3}
.bc-p.tc{background:#6d4fd8}.bc-p.tcw{background:#fff;color:#6d4fd8;border:1px solid #6d4fd8;height:15px}
.bc-t{border-radius:6px;font-size:11.5px;font-weight:700;text-align:center;padding:4px 0;margin-top:4px}
.bc-t.pp{background:var(--pri-soft);color:var(--pri)}.bc-t.le{background:#efeafd;color:#6d4fd8}.bc-t.kl{background:var(--grey-soft);color:var(--muted)}.bc-t.of{color:#b3bccb;font-weight:500}
.bc-d.gtw::after{content:"";position:absolute;left:18%;right:18%;bottom:1px;height:3px;border-radius:2px;background:#e08a00}
.bc-d.loi::after{content:"";position:absolute;left:18%;right:18%;bottom:1px;height:3px;border-radius:2px;background:var(--bad)}
.bc-det .ln2{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.bc-det .ln2:last-child{border-bottom:0}
/* Bảng công kiểu Excel (quản lý) */
table.g{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
table.g th,table.g td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;padding:0;height:34px;min-width:30px;position:relative;white-space:nowrap}
table.g th{background:#fafbfd;font-size:11px;color:var(--muted);font-weight:600;line-height:1.15;position:sticky;top:0;z-index:2}
table.g .nm{position:sticky;left:0;background:#fff;z-index:1;text-align:left;padding:0 8px;min-width:150px;max-width:170px;overflow:hidden;text-overflow:ellipsis;border-right:2px solid var(--line)}
table.g th.nm{z-index:3;background:#fafbfd}
table.g td.c{cursor:pointer}
table.g td.c:hover{outline:2px solid var(--pri);outline-offset:-2px}
table.g .sun{background:#f1f3f7}
table.g th.hol{background:#efeafd;color:#6d4fd8}
table.g td.k-h{color:#e08a00;font-weight:700}
table.g td.k-p{background:var(--pri-soft);color:var(--pri);font-weight:700}
table.g td.k-l{background:#efeafd;color:#6d4fd8;font-weight:700}
table.g td.k-kl{background:var(--grey-soft);color:var(--muted);font-weight:600}
table.g td.k-er{background:var(--bad-soft);color:var(--bad);font-weight:700}
table.g td.k-off{color:#b3bccb}
table.g td.muon::before{content:"";position:absolute;left:3px;top:3px;width:5px;height:5px;border-radius:50%;background:#e08a00}
table.g sup{position:absolute;right:2px;top:1px;font-size:9px;color:#6d4fd8;font-weight:700}
table.g sup.w{color:#e08a00}
table.g .tt{font-weight:700;background:#fafbfd;min-width:40px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;white-space:nowrap;cursor:pointer;font-size:13.5px;font-weight:500}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chip .cnt{display:inline-block;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:4px}

/* Check-in */
.clock{font-size:52px;font-weight:700;letter-spacing:-1px;text-align:center;margin-top:4px}
.date{text-align:center;color:var(--muted)}
.ci-btn{width:190px;height:190px;border-radius:50%;border:0;margin:22px auto 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:19px;cursor:pointer;
  background:radial-gradient(circle at 30% 25%,var(--pri-light),var(--pri) 60%,var(--pri2));box-shadow:0 12px 30px rgba(14,124,116,.32),inset 0 -6px 0 rgba(0,0,0,.12);transition:transform .1s}
.ci-btn:active{transform:scale(.97)}
.ci-btn.out{background:radial-gradient(circle at 30% 25%,#f0a23a,#d9730d 60%,#a65304);box-shadow:0 12px 30px rgba(217,115,13,.35),inset 0 -6px 0 rgba(0,0,0,.12)}
.ci-btn.done{background:radial-gradient(circle at 30% 25%,#3cc489,#14915a 60%,#0c6b41);box-shadow:0 12px 30px rgba(20,145,90,.3)}
.ci-btn svg{width:44px;height:44px;margin-bottom:6px}
.ci-btn small{font-weight:500;font-size:12.5px;opacity:.9;margin-top:2px}
.ci-times{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ci-times > div{background:var(--grey-soft);border-radius:12px;padding:10px 12px}
.ci-times b{font-size:20px;display:block}
.gps{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:10px 12px;border-radius:10px;background:var(--grey-soft);margin-top:12px}
.gps.ok{background:var(--ok-soft);color:#0d6b42} .gps.bad{background:var(--bad-soft);color:#9e1f1f}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.stat b{display:block;font-size:24px;line-height:1.2}
.stat span{font-size:12.5px;color:var(--muted)}

/* Lists & tables */
.list > .it{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.list > .it:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)} .b-grey{background:var(--grey-soft);color:var(--muted)} .b-pri{background:var(--pri-soft);color:var(--pri)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfd;position:sticky;top:0}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:#f7f9fc}
table.t tfoot td{font-weight:700;background:#fafbfd}
table.t input.i{min-height:34px;padding:6px 8px;font-size:13px;min-width:110px}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}

/* Payslip */
.slip{max-width:560px;margin:0 auto}
.slip .hd{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:10px}
.slip .hd .co{font-weight:700;font-size:14px;text-transform:uppercase}
.slip .hd h2{margin-top:6px}
.slip .ln{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px;gap:10px}
.pwbox{position:relative}.pwbox .i{padding-right:46px}
.pwbox .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px}
.pwbox .eye:hover{color:var(--pri)}
.slip .ln.sub{padding-left:14px;color:var(--muted);font-size:13px}
.slip .sec{font-weight:700;margin-top:14px;padding:6px 0;color:var(--pri);font-size:13px;text-transform:uppercase;letter-spacing:.3px}
.slip .net{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:14px;background:var(--pri-soft);border-radius:12px;font-weight:700}
.slip .net b{font-size:22px;color:var(--pri)}

/* Modal / toast / loading */
.modal-bg{position:fixed;inset:0;background:rgba(15,25,45,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.modal-bg{align-items:center}}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px 22px}
@media (min-width:640px){.modal{border-radius:18px}}
.modal.wide{max-width:760px}
.modal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.x{border:0;background:var(--grey-soft);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}
#toast{pointer-events:none;position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;z-index:80;max-width:92vw;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:opacity .2s}
#toast.err{background:var(--bad)} #toast.ok{background:var(--ok)}
#loading{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;overflow:hidden}

@keyframes ld{0%{left:-40%}100%{left:100%}}

/* Login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--pri) 0%,var(--pri2) 55%,var(--bg) 55.1%)}
.login .card{width:100%;max-width:380px;padding:26px 22px}
.logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#ffb020,#ff7a00);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 6px 16px rgba(255,122,0,.35)}
.logo svg{width:32px;height:32px;color:#fff}

/* Trang chủ nhân viên */
.hm-top{display:flex;align-items:flex-start;gap:10px;margin:4px 0 14px}
.hm-top .av{width:44px;height:44px;font-size:15px}
.hm-date{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:12.5px;line-height:1.25}
.hm-h{font-size:26px;line-height:1.2;font-weight:700;margin:2px 0;letter-spacing:-.3px}
.hm-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.hm-tiles>div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 12px;box-shadow:var(--shadow)}
.hm-tiles span{font-size:12.5px;color:var(--muted);display:block}
.hm-tiles b{font-size:20px;display:block;margin-top:4px;letter-spacing:-.3px;white-space:nowrap}
.hm-tiles .hl{background:var(--pri);border-color:var(--pri);color:#fff}
.hm-tiles .hl span{color:rgba(255,255,255,.85)}
.hm-row{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.hm-mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.hm-mini div{background:var(--grey-soft);border-radius:12px;padding:8px 6px;text-align:center}
.hm-mini b{display:block;font-size:17px}
.hm-mini span{font-size:11.5px;color:var(--muted)}
.hm-bar{display:flex;gap:4px;margin-top:10px}
.hm-bar i{flex:1;height:22px;border-radius:5px;background:var(--grey-soft)}
.hm-bar i.ok{background:var(--pri)} .hm-bar i.wa{background:#7fc9c1} .hm-bar i.er{background:var(--bad)} .hm-bar i.pp{background:#bfe3de}
.rq-card{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:#fff}
.rq-card .rq-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rq-card .rq-g{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;margin-top:10px}
.rq-card .rq-g>div{display:flex;gap:8px;align-items:center;min-width:0}
.rq-ic{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--pri);flex:none}
.rq-ic svg{width:17px;height:17px}
.rq-card .lb{font-size:11.5px;color:var(--muted)}
.rq-card .vl{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Camera quét mặt: toàn màn hình */
.cam{position:fixed;inset:0;background:#fff;z-index:70;color:var(--ink);overflow:auto;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 16px);text-align:center}
.cam .ctop h3{font-size:17px;margin:0}
.cam .steps{display:flex;gap:6px;justify-content:center;margin:10px 0 6px}
.cam .steps i{width:34px;height:6px;border-radius:3px;background:#e4e9e9}
.cam .steps i.on{background:var(--pri)}
.cam .stepTxt{font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--muted)}
.cam .msg{font-size:21px;font-weight:700;margin:6px 0 2px;min-height:30px;color:var(--ink)}
.cam .msg.ok{color:var(--ok)} .cam .msg.bad{color:#d07b00}
.cam .vwrap{position:relative;width:min(70vw,290px);aspect-ratio:3/4;border-radius:50%;overflow:hidden;margin:12px auto 8px;background:#111;flex:none}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam .oval{position:absolute;inset:0;border-radius:50%;border:7px solid #d7dede;transition:border-color .2s;pointer-events:none}
.cam .oval.ok{border-color:var(--ok)} .cam .oval.bad{border-color:#f0a400}
.cam .arrow{font-size:30px;color:var(--pri);height:34px;animation:sway 1.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
.cam .sub{font-size:13.5px;color:var(--muted);max-width:330px;margin:2px auto 0}
.cam .cinfo{margin-top:auto;width:100%;max-width:420px;border:1px solid var(--line);border-radius:18px;padding:12px 14px;text-align:left;display:flex;gap:10px;align-items:center;background:#fff;box-shadow:var(--shadow)}
.cam .cinfo .av{width:40px;height:40px}
.cam .bottom{width:100%;max-width:420px;margin-top:10px}
.cam .bottom .btn{width:100%;border-radius:14px;min-height:48px}
.faces{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.faces .card{margin:0;padding:12px}
.ph{width:100%;aspect-ratio:3/4;background:#e9edf3;border-radius:10px;object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.lnk{color:var(--pri);cursor:pointer;text-decoration:underline;white-space:nowrap}

@media print{
  .top,.nav,.no-print,.chips{display:none!important}
  main{padding:0} .card{box-shadow:none}
  body{background:#fff}
}

<script>
/* ===================== NỀN TẢNG ===================== */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => (Math.round(Number(v) || 0)).toLocaleString('vi-VN');
const n = v => Number(v) || 0;
const fmtNum = v => { const x = Number(v) || 0; return Number.isInteger(x) ? String(x) : x.toLocaleString('vi-VN', {maximumFractionDigits: 2}); };
const pad = x => ('0' + x).slice(-2);
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const thisMonth = () => todayStr().slice(0, 7);
const vnDate = s => { if (!s) return ''; const p = String(s).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : p.length === 2 ? p[1] + '/' + p[0] : s; };
const DOW = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
const dowOf = s => { const p = s.split('-').map(Number); return DOW[new Date(p[0], p[1] - 1, p[2]).getDay()]; };
const initials = name => String(name || '?').trim().split(/\s+/).slice(-2).map(w => w[0]).join('').toUpperCase();

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

let TOKEN = store.get('cc_token');
let ME = null, INFO = {};
let pending = 0;
let NAV = 0; // tăng mỗi khi chuyển trang: kết quả của trang cũ về muộn sẽ bị bỏ qua

function busy(on) { pending += on ? 1 : -1; $('#loading').classList.toggle('hidden', pending <= 0); }

/* Bộ nhớ đệm: trang đã xem sẽ hiện ngay lập tức, dữ liệu mới được tải ngầm rồi cập nhật */
const READS = ['today', 'myAttendance', 'myRequests', 'myPayslips', 'dashboard', 'listEmployees', 'listAttendance', 'listRequests',
  'getAdjustments', 'getPayroll', 'getSettings', 'listBranches', 'listHolidays', 'listSchedules'];
let CACHE = {};
// Lưu bộ nhớ đệm vào máy để lần mở app sau hiện dữ liệu ngay, rồi cập nhật ngầm
const cacheKeyLS = () => 'cc_cache_' + (ME ? ME.MaNV : '');
function loadCache() { try { CACHE = JSON.parse(localStorage.getItem(cacheKeyLS()) || '{}'); } catch (e) { CACHE = {}; } }
let saveTimer = null;
function saveCache() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      const keep = {};
      Object.keys(CACHE).sort((a, b) => CACHE[b].t - CACHE[a].t).slice(0, 30).forEach(k => keep[k] = CACHE[k]);
      let j = JSON.stringify(keep);
      if (j.length > 1500000) j = '{}';
      localStorage.setItem(cacheKeyLS(), j);
    } catch (e) {}
  }, 300);
}
let REFRESH = null; // hàm vẽ lại trang hiện tại
let refreshTimer = null;

function call(action, payload) {
  if (READS.indexOf(action) < 0) {
    if (['info', 'me', 'login', 'getPhoto', 'logout', 'otSites', 'netOT', 'debts', 'myProfile', 'netPC', 'exportBank', 'exportPayroll', 'exportAttendance', 'myNotices', 'readNotices', 'listNotices', 'adminTodo', 'debtList'].indexOf(action) < 0) { CACHE = {}; saveCache(); } // có thay đổi dữ liệu → xóa đệm
    return rawCall(action, payload);
  }
  const key = action + '|' + JSON.stringify(payload || {});
  const hit = CACHE[key];
  const fresh = rawCall(action, payload, true).then(d => {
    const changed = !hit || JSON.stringify(hit.d) !== JSON.stringify(d);
    CACHE[key] = { d: d, t: Date.now() };
    saveCache();
    if (hit && changed) scheduleRefresh();
    return d;
  });
  if (hit) { fresh.catch(() => {}); return Promise.resolve(hit.d); }
  // Chưa có đệm: chờ máy chủ; nếu người dùng đã chuyển trang thì bỏ qua kết quả (vẫn lưu vào đệm)
  const nav0 = NAV;
  return new Promise((res, rej) => fresh.then(d => { if (nav0 === NAV) res(d); }, e => { if (nav0 === NAV) rej(e); }));
}

function scheduleRefresh() {
  clearTimeout(refreshTimer);
  const nav0 = NAV;
  refreshTimer = setTimeout(() => {
    if (nav0 !== NAV || !REFRESH) return;
    const a = document.activeElement;
    const typing = a && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
    if (typing || $('#modalRoot').children.length) return; // đang nhập liệu: không vẽ lại để khỏi mất chữ
    const y = window.scrollY;
    REFRESH(true);
    setTimeout(() => window.scrollTo(0, y), 30);
  }, 150);
}

/* Đo tốc độ: thời gian cả vòng (máy ↔ Google) và thời gian máy chủ xử lý, lưu 40 lần gần nhất trên máy này */
const ACT_VN = { today: 'Mở trang chấm công', checkIn: 'Chấm công vào/ra', myAttendance: 'Lịch sử chấm công', myRequests: 'Đơn của tôi', createRequest: 'Gửi đơn',
  myPayslips: 'Phiếu lương', me: 'Mở app', login: 'Đăng nhập', dashboard: 'Tổng quan', listEmployees: 'Danh sách nhân viên', saveEmployee: 'Lưu hồ sơ',
  deleteEmployee: 'Xóa nhân viên', deleteEmployees: 'Xóa nhiều nhân viên', listAttendance: 'Bảng công', saveAttendance: 'Sửa công', listRequests: 'Danh sách đơn', decideRequest: 'Duyệt 1 đơn',
  decideMany: 'Duyệt tất cả', getAdjustments: 'Bước 1 điều chỉnh', saveAdjustments: 'Lưu điều chỉnh', calcPayroll: 'Tính lương', getPayroll: 'Xem bảng lương',
  publishPayroll: 'Công bố lương', setPaid: 'Đánh dấu đã trả', exportPayroll: 'Xuất Excel lương', exportBank: 'File chuyển khoản', otSites: 'Trang tăng ca',
  registerOT: 'Đăng ký tăng ca', getSettings: 'Cài đặt', listBranches: 'Công trình', listSchedules: 'Lịch làm việc', netOT: 'Tăng ca lương NET', myNotices: 'Thông báo', sendNotice: 'Gửi thông báo', explainAttendance: 'Gửi giải trình', exportAttendance: 'Xuất bảng công', setRole: 'Đổi quyền', adminTodo: 'Việc cần làm', debtList: 'Sổ nợ' };
let SPEED = [];
try { SPEED = JSON.parse(localStorage.getItem('cc_speed') || '[]'); } catch (e) { SPEED = []; }
function logSpeed(action, t0, r) {
  try {
    SPEED.unshift({ a: action, t: Date.now() - t0, s: r && r.ms != null ? r.ms : null, at: new Date().toTimeString().slice(0, 8) });
    SPEED = SPEED.slice(0, 40);
    localStorage.setItem('cc_speed', JSON.stringify(SPEED));
  } catch (e) {}
}

function rawCall(action, payload, keepNav) {
  const t0 = Date.now();
  return new Promise((resolve, reject) => {
    if (!(window.google && google.script && google.script.run)) {
      // Phương án dự phòng: trang đặt ngoài Apps Script, gọi API qua địa chỉ /exec
      if (!window.API_URL) { reject(new Error('Trang này cần chạy trong Google Apps Script')); return; }
      busy(true);
      const nav0 = NAV;
      fetch(window.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ a: action, t: TOKEN, p: payload || {} }) })
        .then(x => x.json())
        .then(r => {
          busy(false); logSpeed(action, t0, r);
          const msg = r && r.ok ? '' : ((r && r.error) || 'Có lỗi xảy ra');
          if (msg.indexOf('AUTH:') === 0) return authExpired(msg);
          if (nav0 !== NAV && !keepNav) return;
          if (!msg) resolve(r.data); else reject(new Error(msg));
        })
        .catch(() => { busy(false); if (nav0 === NAV) reject(new Error('Mất kết nối, thử lại')); });
      return;
    }
    busy(true);
    const nav0 = NAV;
    google.script.run
      .withSuccessHandler(r => {
        busy(false); logSpeed(action, t0, r);
        const msg = r && r.ok ? '' : ((r && r.error) || 'Có lỗi xảy ra');
        if (msg.indexOf('AUTH:') === 0) return authExpired(msg);
        if (nav0 !== NAV && !keepNav) return;
        if (!msg) resolve(r.data); else reject(new Error(msg));
      })
      .withFailureHandler(e => { busy(false); if (nav0 === NAV) reject(new Error((e && e.message) || 'Mất kết nối, thử lại')); })
      .api(action, TOKEN, payload || {});
  });
}

function authExpired(msg) {
  const wasIn = !!TOKEN;
  logoutLocal(); stopClock(); closeModal(); NAV++;
  if (wasIn) { showLogin(); toast(msg.slice(5).trim(), 'err'); }
}

let toastTimer;
function toast(msg, type) {
  const t = $('#toast');
  t.textContent = msg; t.className = type || '';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), type === 'err' ? 5000 : 3000);
}
const fail = e => toast(e.message || String(e), 'err');

function modal(title, bodyHtml, opts) {
  opts = opts || {};
  const root = $('#modalRoot');
  root.innerHTML = '<div class="modal-bg"><div class="modal ' + (opts.wide ? 'wide' : '') + '"><div class="mh"><h2>' + esc(title) + '</h2>' +
    (opts.noClose ? '' : '<button class="x" data-close>×</button>') + '</div><div class="mb-body">' + bodyHtml + '</div></div></div>';
  const bg = $('.modal-bg', root);
  if (!opts.noClose) {
    $('[data-close]', root).onclick = closeModal;
    bg.addEventListener('click', e => { if (e.target === bg) closeModal(); });
  }
  return $('.modal', root);
}
function closeModal() { $('#modalRoot').innerHTML = ''; }

function confirmBox(msg, okText) {
  return new Promise(res => {
    const m = modal('Xác nhận', '<p>' + esc(msg) + '</p><div class="row mt2" style="justify-content:flex-end"><button class="btn light" id="cfNo">Hủy</button><button class="btn" id="cfYes">' + esc(okText || 'Đồng ý') + '</button></div>');
    $('#cfNo', m).onclick = () => { closeModal(); res(false); };
    $('#cfYes', m).onclick = () => { closeModal(); res(true); };
  });
}

function formData(root) {
  const o = {};
  $$('[name]', root).forEach(el => { o[el.name] = el.type === 'checkbox' ? el.checked : el.value; });
  return o;
}

/* ===================== ICONS ===================== */
const IC = {
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>',
  money: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 10v5M18 10v5"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  admin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg>',
  pin: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  finger: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11V6a3 3 0 0 1 6 0v5"/><path d="M6 11a6 6 0 0 1 12 0v3a6 6 0 0 1-12 0z"/><path d="M12 11v4"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12l5 5L20 7"/></svg>',
  ot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M9 2h6M12 2v3"/></svg>'

const FACE_CDN = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/';
let faceReady = null;

function loadFaceApi() {
  if (faceReady) return faceReady;
  faceReady = new Promise((res, rej) => {
    if (window.faceapi) return res();
    const sc = document.createElement('script');
    sc.src = FACE_CDN + 'dist/face-api.js';
    sc.onload = () => res();
    sc.onerror = () => rej(new Error('Không tải được bộ nhận diện khuôn mặt. Kiểm tra mạng rồi thử lại.'));
    document.head.appendChild(sc);
  }).then(async () => {
    try { if (faceapi.tf && faceapi.tf.ready) await faceapi.tf.ready(); } catch (e) {}
    const u = FACE_CDN + 'model';
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(u),
      faceapi.nets.faceLandmark68Net.loadFromUri(u),
      faceapi.nets.faceRecognitionNet.loadFromUri(u)
    ]);
  });
  faceReady.catch(() => { faceReady = null; });
  return faceReady;
}

async function detectFace(video) {
  const r = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 256, scoreThreshold: 0.4 }))
    .withFaceLandmarks().withFaceDescriptor();
  if (!r) return null;
  const pts = r.landmarks.positions;
  const eyeL = pts[36], eyeR = pts[45], nose = pts[30];
  return {
    desc: Array.from(r.descriptor),
    yaw: (nose.x - eyeL.x) / ((eyeR.x - eyeL.x) || 1), // 0,5 = nhìn thẳng
    size: r.detection.box.width / (Math.min(video.videoWidth, video.videoHeight) || 480)
  };
}

const faceDist = (a, b) => Math.sqrt(a.reduce((t, x, i) => t + (x - b[i]) * (x - b[i]), 0));

/**
 * Mở camera, yêu cầu: nhìn thẳng → quay đầu sang một bên → nhìn thẳng lại.
 * Ảnh in/ảnh trên điện thoại khác không thể "quay đầu" nên bị loại.
 * Trả về { descs: [mẫu...], desc: mẫu trung bình, photo } hoặc null nếu hủy.
 */
function faceScan(opts) {
  opts = opts || {};
  return new Promise((resolve, reject) => {
    const el = document.createElement('div');
    el.className = 'cam';
    // Nền trắng: màn hình sáng chiếu vào mặt như đèn, quét được cả chỗ tối
    el.innerHTML = '<div class="ctop"><h3>' + esc(opts.title || 'Quét khuôn mặt') + '</h3><div class="steps"><i class="on"></i><i></i><i></i></div><div class="stepTxt">BƯỚC 1/3 · NHÌN THẲNG</div></div>' +
      '<div class="vwrap"><video playsinline muted autoplay></video><div class="oval"></div></div>' +
      '<div class="msg">Đang mở camera…</div><div class="arrow" style="visibility:hidden">⟷</div>' +
      '<div class="sub">Đưa mặt vào giữa vòng tròn · bỏ nón, khẩu trang, kính râm</div>' +
      '<div class="cinfo"><div class="av">' + esc(initials(ME ? ME.HoTen : '')) + '</div><div class="grow"><b>' + esc(ME ? ME.HoTen : '') + '</b><div class="tiny muted">' + esc(ME ? ME.MaNV : '') + ' · ' + new Date().toTimeString().slice(0, 5) + '</div></div></div>' +
      '<div class="bottom"><button class="btn light">Hủy</button></div>';
    document.body.appendChild(el);
    $('#toast').classList.add('hidden');
    const video = $('video', el), oval = $('.oval', el), msg = $('.msg', el), stepTxt = $('.stepTxt', el), arrow = $('.arrow', el), sub = $('.sub', el);
    const setStep = n => {
      stepTxt.textContent = 'BƯỚC ' + n + '/3 · ' + ['NHÌN THẲNG', 'QUAY ĐẦU', 'NHÌN THẲNG LẠI'][n - 1];
      $$('.steps i', el).forEach((x, i) => x.classList.toggle('on', i < n));
      arrow.style.visibility = n === 2 ? 'visible' : 'hidden';
      if (n > 1 && navigator.vibrate) navigator.vibrate(40);
    };
    let lastSeen = Date.now();
    let stream = null, done = false;
    const say = (t, cls) => { msg.textContent = t; msg.className = 'msg ' + (cls || ''); oval.className = 'oval ' + (cls || ''); };
    const finish = (err, val) => {
      if (done) return; done = true;
      if (stream) stream.getTracks().forEach(t => t.stop());
      el.remove();
      err ? reject(err) : resolve(val);
    };
    $('.btn', el).onclick = () => finish(null, null);
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    (async () => {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Trình duyệt này không mở được camera. Hãy dùng Chrome (Android) hoặc Safari (iPhone).');
        const modelP = loadFaceApi();
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 640 } }, audio: false });
        } catch (e) {
          throw new Error(e && e.name === 'NotAllowedError' ? 'Bạn chưa cho phép dùng camera. Vào cài đặt trình duyệt, cho phép Camera cho trang này rồi thử lại.' : 'Không mở được camera trước. Thử đóng các app đang dùng camera rồi thử lại.');
        }
        if (done) return;
        video.srcObject = stream;
        try { await video.play(); } catch (e) {}
        say('Đang tải bộ nhận diện… (lần đầu hơi lâu)');
        await modelP;
        if (done) return;
        const t0 = Date.now();
        const timeout = () => { if (Date.now() - t0 > 60000) throw new Error('Hết thời gian quét. Hãy thử lại ở nơi đủ sáng.'); };
        const MIN_SIZE = 0.09;
        const hint = f => {
          if (f) lastSeen = Date.now();
          sub.textContent = !f && Date.now() - lastSeen > 3000 ? 'Không thấy mặt: quay mặt về phía có ánh sáng, đưa điện thoại ngang tầm mắt' : 'Đưa mặt vào giữa vòng tròn · bỏ nón, khẩu trang, kính râm';
          return !f ? 'Đưa khuôn mặt vào vòng tròn' : f.size < MIN_SIZE ? 'Đưa điện thoại lại gần hơn' : 'Nhìn thẳng vào camera';
        };

        // Bước 1: nhìn thẳng (nới dần điều kiện nếu quá 4 giây để không ai bị kẹt)
        setStep(1);
        let d1 = null, base = 0.5, ok = 0;
        const s1 = Date.now();
        while (!done && !d1) {
          timeout();
          const f = await detectFace(video);
          const tol = Date.now() - s1 > 3000 ? 0.26 : 0.18;
          if (f && f.size >= MIN_SIZE && Math.abs(f.yaw - 0.5) < tol) {
            ok++; say('Giữ yên…', 'ok');
            if (ok >= 2) { d1 = f.desc; base = f.yaw; }
          } else { ok = 0; say(hint(f), f ? 'bad' : ''); }
          await sleep(60);
        }
        if (done) return;

        // Bước 2: quay đầu sang một bên (so với tư thế nhìn thẳng của chính người đó)
        setStep(2);
        const t1 = Date.now();
        let turned = false;
        say('Từ từ quay đầu sang một bên');
        while (!done && !turned) {
          timeout();
          if (Date.now() - t1 > 20000) throw new Error('Không thấy bạn quay đầu. Hãy thử lại và quay đầu rõ hơn.');
          const f = await detectFace(video);
          if (f && Math.abs(f.yaw - base) > 0.11) turned = true;
          await sleep(40);
        }
        if (done) return;

        // Bước 3: nhìn thẳng lại
        setStep(3);
        const descs = [d1];
        let photo = '';
        ok = 0;
        const s3 = Date.now();
        while (!done && descs.length < (opts.register ? 3 : 2)) {
          timeout();
          const f = await detectFace(video);
          const tol = Date.now() - s3 > 3000 ? 0.16 : 0.10;
          if (f && f.size >= MIN_SIZE && Math.abs(f.yaw - base) < tol) {
            ok++; say('Nhìn thẳng… giữ yên', 'ok');
            if (ok >= 2) {
              if (faceDist(f.desc, d1) > 0.55) throw new Error('Khuôn mặt thay đổi trong lúc quét. Chỉ một người đứng trước camera rồi thử lại.');
              descs.push(f.desc); ok = 0;
              if (!photo) photo = snap(video);
              if (descs.length < (opts.register ? 3 : 2)) await sleep(400);
            }
          } else { ok = 0; say(f ? 'Quay mặt nhìn thẳng lại' : 'Đưa khuôn mặt vào khung', f ? 'bad' : ''); }
          await sleep(60);
        }
        if (done) return;
        say('Xong!', 'ok');
        const avg = descs[0].map((_, i) => descs.reduce((t, d) => t + d[i], 0) / descs.length);
        await sleep(250);
        finish(null, { descs: descs.map(d => d.map(x => Math.round(x * 1e4) / 1e4)), desc: avg.map(x => Math.round(x * 1e4) / 1e4), photo });
      } catch (e) { finish(e); }
    })();
  });
}

function snap(video) {
  const w = 360, h = Math.round(w * (video.videoHeight || 480) / (video.videoWidth || 640));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(video, 0, 0, w, h);
  return c.toDataURL('image/jpeg', 0.72);
}

function getPosition() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve({ err: 'Thiết bị không hỗ trợ định vị' });
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy) }),
      e => resolve({ err: e.code === 1 ? 'Bạn chưa cho phép truy cập vị trí' : e.code === 3 ? 'Lấy vị trí quá lâu, thử lại ở nơi thoáng' : 'Không lấy được vị trí' }),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });
}

async function doCheck(type) {
  const fm = TODAY && TODAY.KhuonMat;
  if (fm && fm.BatBuoc && fm.TrangThai !== 'DUYET') {
    toast(fm.TrangThai === 'CHO' ? 'Khuôn mặt đang chờ quản lý duyệt' : 'Hãy đăng ký khuôn mặt trước', 'err');
    if (fm.TrangThai !== 'CHO') registerFaceFlow(() => vCheckin());
    return;
  }
  const btn = $('#ciBtn'); btn.disabled = true;
  const box = $('#gpsBox');
  box.className = 'gps'; box.innerHTML = IC.pin + '<span>Đang lấy vị trí…</span>';
  const posP = getPosition();
  let face = null;
  if (fm && fm.BatBuoc) {
    try { face = await faceScan({ title: type === 'VAO' ? 'Quét mặt để CHECK-IN' : 'Quét mặt để CHECK-OUT' }); }
    catch (e) { fail(e); box.className = 'gps bad'; box.innerHTML = IC.pin + '<span>' + esc(e.message) + '</span>'; btn.disabled = false; return; }
    if (!face) { btn.disabled = false; box.className = 'gps'; box.innerHTML = IC.pin + '<span>Đã hủy quét mặt</span>'; return; }
    box.innerHTML = IC.pin + '<span>Đang lấy vị trí…</span>';
  }
  const pos = await posP;
  if (pos.err) { box.className = 'gps bad'; box.innerHTML = IC.pin + '<span>' + esc(pos.err) + '</span>'; }
  else { box.className = 'gps ok'; box.innerHTML = IC.pin + '<span>Đã lấy vị trí (sai số ~' + pos.acc + 'm). Đang gửi…</span>'; }
  try {
    const r = await call('checkIn', Object.assign({ Loai: type, ViDo: pos.err ? null : pos.lat, KinhDo: pos.err ? null : pos.lng, DoChinhXac: pos.acc },
      face ? { MoTa: face.desc, SongDong: true, Anh: face.photo } : {}));
    toast(r.msg, 'ok');
    if (navigator.vibrate) navigator.vibrate(80);
    renderCheckin(await call('today'));
  } catch (e) {
    fail(e);
    box.className = 'gps bad'; box.innerHTML = IC.pin + '<span>' + esc(e.message) + '</span>';
    btn.disabled = false;
  }
}

let OT_SITE = '', OT_DATE = '';

/** Thu nhỏ ảnh trước khi gửi (≤ ~280KB) */
function compressImg(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('Không đọc được ảnh'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('File không phải ảnh'));
      img.onload = () => {
        let w = img.width, h = img.height;
        const max = 1280;
        if (Math.max(w, h) > max) { const k = max / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        let q = 0.72, url = c.toDataURL('image/jpeg', q);
        while (url.length > 380000 && q > 0.3) { q -= 0.1; url = c.toDataURL('image/jpeg', q); }
        res(url);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const addMonths = (ds, k) => {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(ds || '')) return '';
  const p = ds.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1 + k, 1);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(p[2], last));
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
};

      el.querySelector('b').textContent = n;
    };
    const render = () => {
      const q = ($('#eSearch').value || '').toLowerCase();

      if ($('#eAll')) $('#eAll').onchange = ev => { $$('#eList [data-pick]').forEach(cb => { cb.checked = ev.target.checked; if (cb.checked) chon[cb.dataset.pick] = true; else delete chon[cb.dataset.pick]; }); bar(); };

      '<div id="eList"></div></div>' +

  } catch (e) { fail(e); }

/** Tải file Excel máy chủ trả về (base64) */
function dlFile(r) {
  const bin = atob(r.Data), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const blob = new Blob([arr], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = r.FileName; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}

          : '<tr><td class="nm" colspan="' + (days.length + 6) + '"><div class="empty">Không có ai</div></td></tr>') + '</tbody>';

      b.disabled = false; b.innerHTML = old;
    };
  } catch (e) { fail(e); }
}

    const rows = p.Rows;

    };
    $('#pAdjT').onclick = () => {
      const box = $('#pAdj');
      if (!box.classList.contains('hidden')) return box.classList.add('hidden');

      box.innerHTML = '<div class="tbl-wrap"><table class="t"><thead><tr><th>Nhân viên</th><th>Thưởng</th><th>Tạm ứng</th><th>Khấu trừ khác</th><th>Trừ nợ vay</th><th>Trừ nghỉ ngang</th><th>Ghi chú</th></tr></thead><tbody>' +
        adj.map(a => '<tr data-ma="' + esc(a.MaNV) + '"><td class="nowrap"><b>' + esc(a.MaNV) + '</b> ' + esc(a.HoTen) + (a.NghiNgang ? ' <span class="badge b-bad">nghỉ ngang</span>' : '') + '</td>' +
          mInp(a, 'Thuong') + mInp(a, 'TamUng') + mInp(a, 'KhauTruKhac') +
          (a.ConNo > 0 ? '<td><input class="i num" inputmode="numeric" data-k="TruNo" value="' + (n(a.TruNo) ? n(a.TruNo).toLocaleString('vi-VN') : '') + '" placeholder="0"><div class="tiny muted">còn nợ ' + money(a.ConNo) + '</div></td>' : '<td class="tiny muted">không nợ</td>') +
          (a.NghiNgang ? '<td><input class="i num" inputmode="numeric" data-k="TruNghiNgang" value="' + (n(a.TruNghiNgang) ? n(a.TruNghiNgang).toLocaleString('vi-VN') : '') + '" placeholder="0"><div class="tiny"><span class="lnk" data-goiy="' + a.GoiYNghiNgang + '">gợi ý ' + money(a.GoiYNghiNgang) + '</span></div></td>' : '<td></td>') +
          '<td><input class="i" data-k="GhiChu" value="' + esc(a.GhiChu) + '"></td></tr>').join('') + '</tbody></table></div>' +
        '<div class="small muted mt">Trừ nợ: quản lý nhập số thỏa thuận tháng này (để trống = không trừ); số nợ chỉ giảm khi công bố bảng lương. Trừ nghỉ ngang: bấm "gợi ý" hoặc nhập số khác – nhập vào là đã duyệt.</div>' +
        '<div class="right mt"><button class="btn" id="pAdjSave">Lưu điều chỉnh</button></div>';
      $$('input.num', box).forEach(el => el.oninput = () => { const v = el.value.replace(/\D/g, ''); el.value = v ? Number(v).toLocaleString('vi-VN') : ''; });
      $$('[data-goiy]', box).forEach(l => l.onclick = () => { const inp = l.closest('td').querySelector('input'); inp.value = Number(l.dataset.goiy).toLocaleString('vi-VN'); });
      $('#pAdjSave').onclick = async () => {
        const items = $$('tr[data-ma]', box).map(tr => {
          const o = { MaNV: tr.dataset.ma };
          $$('input[data-k]', tr).forEach(i => o[i.dataset.k] = i.dataset.k === 'GhiChu' ? i.value : i.value.replace(/\D/g, ''));
          return o;
        });
        try { await call('saveAdjustments', { Thang: PAY_MONTH, Items: items }); toast('Đã lưu điều chỉnh. Bấm "Tính lương" để cập nhật.', 'ok'); aPay(); } catch (e) { fail(e); }
      };
    };
    $('#pCalc').onclick = async () => {
      if (netThieu) return toast('Hãy quyết định trả / không trả tăng ca cho ' + netThieu + ' người lương NET trước', 'err');
      if (rows.length && !(await confirmBox('Tính lại lương tháng ' + vnDate(PAY_MONTH) + '? Kết quả cũ sẽ bị thay thế (trạng thái đã thanh toán được giữ lại).', 'Tính lại'))) return;
      const btn = $('#pCalc'); if (btn.disabled) return; btn.disabled = true; const old = btn.textContent; btn.textContent = 'Đang tính…';
      const cc = ($('#pCC') && $('#pCC').value || '').replace(',', '.').replace(/[^\d.]/g, '');
      try { const r = await call('calcPayroll', { Thang: PAY_MONTH, CongChuan: cc }); toast('Đã tính lương cho ' + r.SoNV + ' người (công chuẩn ' + r.CongChuan + ')', 'ok'); aPay(); } catch (e) { fail(e); btn.disabled = false; btn.textContent = old; }
    };
    if (rows.length) {
      const dl = dlFile;
      $('#pExport').onclick = async () => {
        const b = $('#pExport'), old = b.innerHTML; b.disabled = true; b.innerHTML = 'Đang tạo file…';
        try { dl(await call('exportPayroll', { Thang: PAY_MONTH })); toast('Đã tải file Excel bảng lương', 'ok'); } catch (e) { fail(e); }
        b.disabled = false; b.innerHTML = old;
      };
      $('#pBank').onclick = async () => {
        const b = $('#pBank'), old = b.innerHTML; b.disabled = true; b.innerHTML = 'Đang tạo file…';
        try { const r = await call('exportBank', { Thang: PAY_MONTH }); dl(r); toast('Đã tải file chuyển khoản' + (r.ThieuSTK ? '. ' + r.ThieuSTK + ' người THIẾU số tài khoản' : ''), r.ThieuSTK ? 'err' : 'ok'); } catch (e) { fail(e); }
        b.disabled = false; b.innerHTML = old;
      };
      $('#pPub').onclick = async () => {
        const on = !p.CongBo;
        if (!(await confirmBox(on ? 'Công bố phiếu lương tháng ' + vnDate(PAY_MONTH) + '? Mỗi nhân viên sẽ xem được phiếu lương của mình, và các khoản trừ nợ vay được ghi vào sổ nợ.' : 'Hủy công bố? Nhân viên sẽ tạm thời không xem được phiếu lương tháng này; khoản trừ nợ tháng này được hoàn lại sổ nợ.', on ? 'Công bố' : 'Hủy công bố'))) return;
        try { await call('publishPayroll', { Thang: PAY_MONTH, CongBo: on }); toast(on ? 'Đã công bố phiếu lương' : 'Đã hủy công bố', 'ok'); aPay(); } catch (e) { fail(e); }
      };
      $$('#pPaidF .chip').forEach(c => c.onclick = () => { PAY_PAIDF = c.dataset.f; aPay(); });
      if ($('#pPaidAll')) $('#pPaidAll').onclick = async () => {
        if (!(await confirmBox('Đánh dấu ' + chuaTT.length + ' người chưa thanh toán là ĐÃ chuyển khoản lương tháng ' + vnDate(PAY_MONTH) + '?', 'Đã thanh toán'))) return;
        chuaTT.forEach(r => { const c = $('[data-paid="' + r.MaNV + '"]'); if (c) c.checked = true; });
        try { await call('setPaid', { Thang: PAY_MONTH, MaNV: chuaTT.map(r => r.MaNV), DaTra: true }); toast('Đã đánh dấu thanh toán', 'ok'); aPay(); } catch (e) { fail(e); aPay(); }
      };
      $$('[data-paid]').forEach(cb => {
        cb.onclick = e => e.stopPropagation();
        cb.onchange = async () => {
          // Ô tích đổi ngay; chỉ báo lỗi nếu máy chủ không lưu được
          const badge = cb.parentNode.querySelector('.badge'); if (badge) badge.remove();
          try { await call('setPaid', { Thang: PAY_MONTH, MaNV: [cb.dataset.paid], DaTra: cb.checked }); } catch (e) { fail(e); cb.checked = !cb.checked; }
        };
      });
      $$('#adBody tbody tr[data-ma]').forEach(tr => tr.onclick = e => {
        if (e.target.closest('[data-stop]')) return;
        const r = rows.find(x => x.MaNV === tr.dataset.ma);
        if (r) modal('Phiếu lương', slipHtml(r, INFO.TenCongTy), { wide: true });
      });
    }
  } catch (e) { fail(e); }
}

/** Sổ nợ 1 người: vẽ vào ô #noBox trong root (hồ sơ nhân viên hoặc trang Sổ nợ) */
function debtPanel(m, maNV, after) {
  const fmtIn = el => { el.oninput = () => { const v = el.value.replace(/\D/g, ''); el.value = v ? Number(v).toLocaleString('vi-VN') : ''; }; };
  const LO = { VAY: ['Vay', 'b-bad'], TRU: ['Trừ lương', 'b-pri'], TRA: ['Trả ngoài', 'b-ok'] };
  const drawNo = d => {
    const box = $('#noBox', m); if (!box) return;
    box.className = '';
    box.innerHTML = '<div class="row between wrap"><span>Còn nợ: <b style="font-size:18px;color:' + (d.ConNo ? 'var(--bad)' : 'var(--ok)') + '">' + money(d.ConNo) + 'đ</b></span>' +
      '<div class="row" style="gap:6px"><button type="button" class="btn ghost sm" id="noAdd">+ Thêm khoản vay</button>' + (d.ConNo > 0 ? '<button type="button" class="btn ok sm" id="noPay">Ghi trả nợ</button>' : '') + '</div></div>' +
      '<div id="noForm"></div>' +
      (d.Rows.length ? '<div class="tbl-wrap mt"><table class="t"><thead><tr><th>Ngày</th><th>Loại</th><th>Nội dung</th><th class="right">Số tiền</th><th class="right">Còn lại</th><th></th></tr></thead><tbody>' +
        d.Rows.map(x => '<tr><td class="nowrap">' + vnDate(x.Ngay) + '</td><td><span class="badge ' + (LO[x.Loai] || ['', 'b-grey'])[1] + '">' + (LO[x.Loai] || [x.Loai])[0] + '</span></td><td class="tiny">' + esc(x.GhiChu) + '</td>' +
          '<td class="right num">' + (x.Loai === 'VAY' ? '+' : '−') + money(x.SoTien) + '</td><td class="right num"><b>' + money(x.ConLai) + '</b></td><td class="nowrap">' +
          (x.Loai === 'VAY' ? '<span class="lnk" data-edno="' + esc(x.ID) + '">sửa</span> · ' : '') + (x.Loai !== 'TRU' ? '<span class="lnk" data-delno="' + esc(x.ID) + '">xóa</span>' : '') + '</td></tr>').join('') + '</tbody></table></div>' : '<div class="small muted mt">Chưa có khoản nợ nào.</div>') +
      '<div class="small muted mt">Trừ lương: nhập ở Tính lương → Bước 1, số nợ giảm khi công bố bảng lương. Trả ngoài (tiền mặt / chuyển khoản): bấm "Ghi trả nợ", số nợ giảm ngay.</div>';
    const form = (html, onOk) => {
      $('#noForm', m).innerHTML = '<div class="card flat mt">' + html + '<div class="row mt"><button type="button" class="btn sm" id="noOk">Lưu</button><button type="button" class="btn light sm" id="noX">Hủy</button></div></div>';
      $$('#noForm [data-mn]', m).forEach(fmtIn);
      $('#noX', m).onclick = () => { $('#noForm', m).innerHTML = ''; };
      $('#noOk', m).onclick = async () => { const b = $('#noOk', m); b.disabled = true; try { drawNo(await onOk()); after && after(); } catch (er) { fail(er); b.disabled = false; } };
    };
    const g = id => $(id, m).value;
    $('#noAdd', m).onclick = () => form('<b>Thêm khoản vay</b><div class="grid3"><div><label class="f">Số tiền vay (đ)</label><input class="i" id="nT" inputmode="numeric" data-mn></div><div><label class="f">Ngày</label><input class="i" type="date" id="nN" value="' + todayStr() + '"></div><div><label class="f">Ghi chú</label><input class="i" id="nG" value="Nợ vay công ty"></div></div>',
      async () => { const r = await call('addDebt', { MaNV: maNV, SoTien: g('#nT').replace(/\D/g, ''), Ngay: g('#nN'), GhiChu: g('#nG') }); toast('Đã thêm khoản vay', 'ok'); return r; });
    if ($('#noPay', m)) $('#noPay', m).onclick = () => form('<b>Ghi trả nợ (ngoài lương)</b><div class="grid2"><div><label class="f">Số tiền trả (đ) · còn nợ ' + money(d.ConNo) + '</label><input class="i" id="nT" inputmode="numeric" data-mn></div><div><label class="f">Ngày trả</label><input class="i" type="date" id="nN" value="' + todayStr() + '"></div>' +
      '<div><label class="f">Hình thức</label><select class="i" id="nH"><option value="TM">Tiền mặt</option><option value="CK">Chuyển khoản</option></select></div><div><label class="f">Ghi chú</label><input class="i" id="nG" placeholder="VD: trả bớt đợt 1"></div></div>' +
      '<div class="tiny mt"><span class="lnk" id="nAll">Trả hết ' + money(d.ConNo) + '</span></div>',
      async () => { const r = await call('payDebt', { MaNV: maNV, SoTien: g('#nT').replace(/\D/g, ''), Ngay: g('#nN'), HinhThuc: g('#nH'), GhiChu: g('#nG') }); toast('Đã ghi trả nợ', 'ok'); return r; });
    m.addEventListener('click', ev => { if (ev.target.id === 'nAll') { const i = $('#nT', m); i.value = Number(d.ConNo).toLocaleString('vi-VN'); } });
    $$('[data-edno]', m).forEach(l => l.onclick = () => {
      const x = d.Rows.find(r => r.ID === l.dataset.edno);
      form('<b>Sửa khoản vay</b><div class="grid3"><div><label class="f">Số tiền vay (đ)</label><input class="i" id="nT" inputmode="numeric" data-mn value="' + Number(x.SoTien).toLocaleString('vi-VN') + '"></div><div><label class="f">Ngày</label><input class="i" type="date" id="nN" value="' + esc(x.Ngay) + '"></div><div><label class="f">Ghi chú</label><input class="i" id="nG" value="' + esc(x.GhiChu) + '"></div></div>',
        async () => { const r = await call('editDebt', { ID: x.ID, SoTien: g('#nT').replace(/\D/g, ''), Ngay: g('#nN'), GhiChu: g('#nG') }); toast('Đã sửa khoản vay', 'ok'); return r; });
    });
    // Bấm 2 lần mới xóa
    $$('[data-delno]', m).forEach(l => l.onclick = async () => {
      if (!l.dataset.sure) { l.dataset.sure = '1'; l.textContent = 'bấm lần nữa để xóa'; l.style.color = 'var(--bad)'; return; }
      try { drawNo(await call('deleteDebt', { ID: l.dataset.delno })); after && after(); } catch (er) { fail(er); }
    });
  };
  call('debts', { MaNV: maNV }).then(drawNo).catch(() => {});
}

/* ---- Tạm ứng, sổ nợ (cả công ty) ---- */
let DEBT_ALL = false;
async function aDebt() {

  } catch (e) { fail(e); }

function dtLabel(dt, branches, act) {
  dt = String(dt || 'ALL');
  if (dt === 'ALL') return 'tất cả';
  const kv = dt.split(':'), v = (kv[1] || '').split(',');
  if (kv[0] === 'QUYEN') return 'quyền ' + v.map(x => VAITRO_TEN[x] || x).join(', ');
  if (kv[0] === 'CT') return v.map(x => (branches.find(b => b.ID === x) || {}).TenChiNhanh || x).join(', ');
  if (kv[0] === 'NV') return v.length > 3 ? v.length + ' người' : v.map(x => (act.find(e => e.MaNV === x) || {}).HoTen || x).join(', ');
  return dt;
}

        inp('MoLaiThem', 'Mở lại giải trình cho thêm (ngày)', 'number', 'min="1"') +
        inp('GioiHanGiaiTrinhCC', 'NV giải trình chấm công: tối đa (lần/tháng)', 'number', 'min="0"') + inp('HanGiaiTrinhCC', 'Hạn giải trình chấm công (ngày)', 'number', 'min="1"') + '</div>' +
        '<div class="small muted mt">Tăng ca chỉ do chỉ huy trưởng / quản lý dự án đăng ký (cấp quyền trong hồ sơ nhân viên). Đi làm ngày lễ, Chủ nhật hoặc ở lại quá giờ mà không được đăng ký thì không có công cho phần đó; chỉ huy trưởng phải giải trình trong hạn, quản lý duyệt thì tính như tăng ca bình thường.</div></div>' +
      '<div class="card"><h3>Thử việc & nghỉ ngang</h3><div class="grid3">' +
        inp('TyLeThuViec', 'Tỷ lệ lương thử việc mặc định (%)', 'number', 'step="0.5"') + inp('ThangThuViec', 'Số tháng thử việc mặc định', 'number') +
        inp('TyLeTruNghiNgang', 'Nghỉ ngang: gợi ý trừ (% lương đóng BH)', 'number', 'step="0.5"') + '</div></div>' +
      '<div class="card"><h3>Thuế TNCN & tăng ca</h3><div class="grid2">' + inp('GiamTruBanThan', 'Giảm trừ bản thân / tháng (đ)', 'number') + inp('GiamTruPhuThuoc', 'Giảm trừ mỗi người phụ thuộc (đ)', 'number') + '</div>' +
        inp('BieuThue', 'Biểu thuế lũy tiến (ngưỡng:thuế suất%, 0 = phần còn lại)') + inp('HeSoOT', 'Hệ số OT khi dùng chế độ tổng quát: ngày thường, nghỉ tuần, lễ') + '</div>' +
      '<div class="card"><h3>Quét khuôn mặt</h3>' + radio('BatBuocKhuonMat', [['CO', 'Bắt buộc quét đúng khuôn mặt'], ['KHONG', 'Tắt quét mặt']]) +
        '<div class="grid2">' + inp('NguongKhuonMat', 'Độ chặt so khớp (0,4 rất chặt – 0,6 dễ)', 'number', 'step="0.05" min="0.3" max="0.7"') + '</div>' +
        '<div class="small muted mt">Mặc định 0,5. Nếu nhân viên hay bị báo "không khớp" dù đúng người, tăng lên 0,55. Nếu lo người khác chấm hộ, giảm xuống 0,45.</div></div>' +
      '<div class="card"><h3>Khác</h3>' + radio('BatBuocGPS', [['CO', 'Bắt buộc GPS trong bán kính chi nhánh'], ['KHONG', 'Chỉ ghi nhận vị trí, không chặn']]) +
        '<div class="grid2">' + inp('MatKhauMacDinh', 'Mật khẩu mặc định cho tài khoản mới') + inp('PhepNamMacDinh', 'Số ngày phép năm mặc định', 'number') + '</div></div>' +
      '<div class="right"><button class="btn" id="sSave">Lưu cài đặt</button></div></div>' +
      '<div class="card mt2"><div class="row between"><h3>Tốc độ phản hồi (đo trên máy này)</h3><button class="btn light sm" id="spClear">Xóa số đo</button></div>' +
      '<div class="small muted">Tổng = thời gian bạn chờ (gồm mạng + Google khởi động). Máy chủ = thời gian app xử lý trên Google. Hai số chênh nhiều là do mạng / Google khởi động.</div>' +
      (SPEED.length ? '<div class="tbl-wrap mt"><table class="t"><thead><tr><th>Lúc</th><th>Thao tác</th><th class="right">Tổng (giây)</th><th class="right">Máy chủ (giây)</th></tr></thead><tbody>' +
        SPEED.map(x => '<tr><td class="num">' + esc(x.at) + '</td><td>' + esc(ACT_VN[x.a] || x.a) + '</td><td class="right num"' + (x.t > 3000 ? ' style="color:var(--bad)"' : '') + '>' + (x.t / 1000).toFixed(1) + '</td><td class="right num">' + (x.s == null ? '' : (x.s / 1000).toFixed(1)) + '</td></tr>').join('') +
        '</tbody></table></div>' : '<div class="empty">Chưa có số đo. Dùng app một lúc rồi quay lại đây.</div>') + '</div>';
    $$('#sForm .chips').forEach(g => $$('input[type=radio]', g).forEach(r => r.onchange = () => $$('.chip', g).forEach(c => c.classList.toggle('on', $('input', c).checked))));
    $('#spClear').onclick = () => { SPEED = []; try { localStorage.removeItem('cc_speed'); } catch (e) {} sGen(); };
    $('#sSave').onclick = async () => {
      const f = {};
      $$('#sForm [name]').forEach(el => { if (el.type === 'radio') { if (el.checked) f[el.name] = el.value; } else f[el.name] = el.value; });
      try { await call('saveSettings', { Values: f }); toast('Đã lưu cài đặt', 'ok'); INFO.TenCongTy = f.TenCongTy; $('#hdCo').textContent = f.TenCongTy; } catch (e) { fail(e); }
    };
  } catch (e) { fail(e); }
}

const THU = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
async function sSched() {
  try {
    const list = await call('listSchedules');
    const dayTxt = v => ({ '1': 'cả ngày', '0.5': 'nửa ngày', '0': 'nghỉ' })[String(v)] || v;
    $('#sBody').innerHTML = '<div class="row between mb wrap"><div class="small muted">Mỗi nhóm nhân viên có giờ làm và ngày nghỉ riêng. Gán lịch cho từng người trong hồ sơ nhân viên.</div><button class="btn" id="scAdd">+ Thêm lịch</button></div>' +
      list.map(x => {
        const d = String(x.CongTheoThu).split(',');
        return '<div class="card"><div class="row between wrap"><div><h3>' + esc(x.TenLich) + '</h3><div class="small muted">' + esc(x.GioVao) + '–' + esc(x.GioRa) + (x.NghiTrua ? ' · nghỉ trưa ' + esc(x.NghiTrua) : '') + ' · ' + esc(x.GioChuan) + ' giờ/ngày · ' + x.SoNV + ' người đang dùng</div></div>' +
          '<button class="btn ghost sm" data-sc="' + esc(x.ID) + '">Sửa</button></div>' +
          '<div class="row wrap mt">' + THU.map((t, i) => '<span class="badge ' + (d[i] === '1' ? 'b-ok' : d[i] === '0.5' ? 'b-warn' : 'b-grey') + '">' + t + ': ' + dayTxt(d[i]) + '</span>').join('') + '</div>' +
          '<div class="small mt">Công chuẩn: <b>' + (x.CheDoCongChuan === 'CODINH' ? 'cố định ' + esc(x.CongChuan) + ' công' : 'theo lịch thực tế') + '</b> · tháng này = <b>' + fmtNum(x.CongThangNay) + ' công</b>' + (x.GhiChu ? ' · <span class="muted">' + esc(x.GhiChu) + '</span>' : '') + '</div></div>';
      }).join('');
    $('#scAdd').onclick = () => schedForm(null);
    $$('[data-sc]').forEach(b => b.onclick = () => schedForm(list.find(x => x.ID === b.dataset.sc)));
  } catch (e) { fail(e); }
}

function schedForm(x) {
  const isNew = !x;
  x = x || { GioVao: '08:00', GioRa: '17:00', NghiTrua: '12:00-13:00', GioChuan: '8', CongTheoThu: '1,1,1,1,1,1,0', CheDoCongChuan: 'THUCTE', CongChuan: '26' };
  const d = String(x.CongTheoThu).split(',');
  const nt = String(x.NghiTrua || '').split('-');
  const m = modal(isNew ? 'Thêm lịch làm việc' : 'Sửa lịch: ' + x.TenLich,
    '<label class="f">Tên lịch</label><input class="i" name="TenLich" value="' + esc(x.TenLich || '') + '" placeholder="VD: Văn phòng, Công trường…">' +
    '<div class="grid2"><div><label class="f">Giờ vào</label><input class="i" type="time" name="GioVao" value="' + esc(x.GioVao) + '"></div><div><label class="f">Giờ ra</label><input class="i" type="time" name="GioRa" value="' + esc(x.GioRa) + '"></div>' +
    '<div><label class="f">Nghỉ trưa từ</label><input class="i" type="time" id="nt1" value="' + esc(nt[0] || '') + '"></div><div><label class="f">Nghỉ trưa đến</label><input class="i" type="time" id="nt2" value="' + esc(nt[1] || '') + '"></div>' +
    '<div><label class="f">Số giờ làm chuẩn 1 ngày</label><input class="i" type="number" step="0.5" name="GioChuan" value="' + esc(x.GioChuan) + '"></div></div>' +
    '<label class="f">Công từng ngày trong tuần</label><div class="grid3" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px">' +
      THU.map((t, i) => '<div><div class="tiny muted">' + t + '</div><select class="i" data-d="' + i + '"><option value="1"' + (d[i] === '1' ? ' selected' : '') + '>Cả ngày</option><option value="0.5"' + (d[i] === '0.5' ? ' selected' : '') + '>Nửa ngày</option><option value="0"' + (d[i] === '0' ? ' selected' : '') + '>Nghỉ</option></select></div>').join('') + '</div>' +
    '<label class="f">Công chuẩn mỗi tháng</label><select class="i" name="CheDoCongChuan"><option value="THUCTE">Theo lịch thực tế (tự đếm, VD tháng 26 / tháng 27 công)</option><option value="CODINH"' + (x.CheDoCongChuan === 'CODINH' ? ' selected' : '') + '>Cố định số công</option></select>' +
    '<div class="grid2"><div><label class="f">Số công cố định</label><input class="i" type="number" step="0.5" name="CongChuan" value="' + esc(x.CongChuan) + '"></div><div><label class="f">Ghi chú</label><input class="i" name="GhiChu" value="' + esc(x.GhiChu || '') + '"></div></div>' +
    '<div class="row mt2">' + (isNew ? '' : '<button class="btn light" id="scDel" style="color:var(--bad)">Xóa</button>') + '<span class="grow"></span><button class="btn" id="scSave">Lưu</button></div>', { wide: true });
  $('#scSave', m).onclick = async () => {
    const f = formData(m); f.ID = x.ID;
    f.CongTheoThu = $$('[data-d]', m).map(s => s.value).join(',');
    const a = $('#nt1', m).value, b = $('#nt2', m).value;
    f.NghiTrua = a && b ? a + '-' + b : '';
    try { await call('saveSchedule', f); closeModal(); toast('Đã lưu lịch', 'ok'); sSched(); } catch (e) { fail(e); }
  };
  if (!isNew) $('#scDel', m).onclick = async () => {
    if (!(await confirmBox('Xóa lịch ' + x.TenLich + '?', 'Xóa'))) return;
    try { await call('deleteSchedule', { ID: x.ID }); closeModal(); toast('Đã xóa', 'ok'); sSched(); } catch (e) { fail(e); }
  };
}

async function sBranch() {
  try {
    const list = await call('listBranches');
    $('#sBody').innerHTML = '<div class="row between mb"><div class="small muted">Nhân viên chỉ chấm công được khi đứng trong bán kính của một chi nhánh.</div><button class="btn" id="bAdd">+ Thêm chi nhánh</button></div>' +
      '<div class="card"><div class="list">' + list.map(b => '<div class="it"><div class="av">' + IC.pin + '</div><div class="grow"><b>' + esc(b.TenChiNhanh) + '</b> ' + (b.HoatDong === 'KHONG' ? '<span class="badge b-grey">Tạm tắt</span>' : '') +
        '<div class="tiny muted">' + esc(b.DiaChi || '') + ' · bán kính ' + esc(b.BanKinh) + 'm' + (b.GioVao && b.GioRa ? ' · giờ làm ' + esc(b.GioVao) + '–' + esc(b.GioRa) : ' · giờ theo lịch NV') + '</div></div>' +
        '<a class="btn light sm" target="_blank" href="https://www.google.com/maps?q=' + encodeURIComponent(b.ViDo + ',' + b.KinhDo) + '">Bản đồ</a><button class="btn ghost sm" data-b="' + esc(b.ID) + '">Sửa</button></div>').join('') + '</div></div>';
    $('#bAdd').onclick = () => branchForm(null, list.length);
    $$('[data-b]').forEach(x => x.onclick = () => branchForm(list.find(b => b.ID === x.dataset.b), list.length));
  } catch (e) { fail(e); }
}

function branchForm(b, count) {
  const isNew = !b;
  b = b || { BanKinh: '150', HoatDong: 'CO' };
  const m = modal(isNew ? 'Thêm chi nhánh' : 'Sửa chi nhánh',
    '<label class="f">Tên chi nhánh</label><input class="i" name="TenChiNhanh" value="' + esc(b.TenChiNhanh || '') + '">' +
    '<label class="f">Địa chỉ</label><input class="i" name="DiaChi" value="' + esc(b.DiaChi || '') + '">' +
    '<label class="f">Tọa độ (dán từ Google Maps, VD: 10.776889, 106.700806)</label><input class="i" id="bCoord" value="' + esc(b.ViDo ? b.ViDo + ', ' + b.KinhDo : '') + '">' +
    '<button class="btn ghost block mt" id="bHere">' + IC.pin + ' Lấy vị trí tôi đang đứng</button>' +
    '<div class="tiny muted mt">Cách lấy tọa độ: mở Google Maps, nhấn giữ vào vị trí công ty, rồi sao chép dãy số hiện ra. Hoặc đứng tại công ty và bấm nút trên.</div>' +
    '<div class="grid2"><div><label class="f">Bán kính cho phép (mét)</label><input class="i" type="number" name="BanKinh" value="' + esc(b.BanKinh) + '" min="20"></div>' +
    '<div><label class="f">Trạng thái</label><select class="i" name="HoatDong"><option value="CO">Đang dùng</option><option value="KHONG"' + (b.HoatDong === 'KHONG' ? ' selected' : '') + '>Tạm tắt</option></select></div></div>' +
    '<h3 class="mt2">Giờ làm tại công trình này</h3><div class="small muted mb">Để trống thì tính theo lịch làm việc của nhân viên. Điền vào thì ai chấm công ở đây sẽ tính theo giờ này.</div>' +
    '<div class="grid2"><div><label class="f">Giờ vào</label><input class="i" type="time" name="GioVao" value="' + esc((b.GioVao || '')) + '"></div>' +
    '<div><label class="f">Giờ ra</label><input class="i" type="time" name="GioRa" value="' + esc((b.GioRa || '')) + '"></div>' +
    '<div><label class="f">Nghỉ trưa từ</label><input class="i" type="time" id="bnt1" value="' + esc((String(b.NghiTrua || '').split('-')[0] || '')) + '"></div>' +
    '<div><label class="f">Nghỉ trưa đến</label><input class="i" type="time" id="bnt2" value="' + esc((String(b.NghiTrua || '').split('-')[1] || '')) + '"></div>' +
    '<div><label class="f">Số giờ làm chuẩn / ngày</label><input class="i" type="number" step="0.5" name="GioChuan" value="' + esc(b.GioChuan || '') + '"></div></div>' +
    '<div class="row mt2">' + (!isNew && count > 1 ? '<button class="btn light" id="bDel" style="color:var(--bad)">Xóa</button>' : '') + '<span class="grow"></span><button class="btn" id="bSave">Lưu</button></div>');
  $('#bHere', m).onclick = async () => {
    toast('Đang lấy vị trí…');
    const p = await getPosition();
    if (p.err) return toast(p.err, 'err');
    $('#bCoord', m).value = p.lat.toFixed(6) + ', ' + p.lng.toFixed(6);
    toast('Đã lấy vị trí (sai số ~' + p.acc + 'm)', 'ok');
  };
  $('#bSave', m).onclick = async () => {
    const f = formData(m);
    const c = $('#bCoord', m).value.split(/[,;\s]+/).filter(Boolean);
    f.ViDo = c[0]; f.KinhDo = c[1]; f.ID = b.ID;
    const a = $('#bnt1', m).value, bb = $('#bnt2', m).value;
    f.NghiTrua = a && bb ? a + '-' + bb : '';
    try { await call('saveBranch', f); closeModal(); toast('Đã lưu', 'ok'); sBranch(); } catch (e) { fail(e); }
  };
  if ($('#bDel', m)) $('#bDel', m).onclick = async () => {
    if (!(await confirmBox('Xóa chi nhánh ' + b.TenChiNhanh + '?', 'Xóa'))) return;
    try { await call('deleteBranch', { ID: b.ID }); closeModal(); toast('Đã xóa', 'ok'); sBranch(); } catch (e) { fail(e); }
  };
}

async function sHoliday() {
  try {
    const list = await call('listHolidays');
    $('#sBody').innerHTML = '<div class="card"><h3>Thêm ngày lễ</h3><div class="small muted">12 ngày lễ hưởng lương/năm: 01/01; Tết Âm lịch 5 ngày; Giỗ Tổ 10/3 âm lịch; 30/04; 01/05; 02/09 + 1 ngày liền kề (01/9 hoặc 03/9); 24/11. Tết Âm lịch và ngày liền kề Quốc khánh công ty tự chọn – nhớ nhập mỗi năm, kể cả ngày nghỉ bù.</div>' +
      '<button class="btn ghost sm mt" id="hSeed">Thêm các ngày lễ cố định còn thiếu (năm nay + năm sau)</button>' +
      '<div class="row wrap mt"><input class="i" type="date" id="hD" style="width:auto"><input class="i grow" id="hN" placeholder="Tên ngày lễ"><button class="btn" id="hAdd">Thêm</button></div></div>' +
      '<div class="card"><div class="list">' + (list.length ? list.map(h => '<div class="it"><div class="grow"><b>' + vnDate(h.Ngay) + '</b> <span class="muted small">' + dowOf(h.Ngay) + '</span><div class="small">' + esc(h.TenNgayLe) + '</div></div><button class="btn light sm" data-h="' + esc(h.Ngay) + '">Xóa</button></div>').join('') : '<div class="empty">Chưa có ngày lễ</div>') + '</div></div>';
    $('#hAdd').onclick = async () => {
      try { await call('saveHoliday', { Ngay: $('#hD').value, TenNgayLe: $('#hN').value }); toast('Đã thêm', 'ok'); sHoliday(); } catch (e) { fail(e); }
    };
    $$('[data-h]').forEach(b => b.onclick = async () => { try { await call('deleteHoliday', { Ngay: b.dataset.h }); sHoliday(); } catch (e) { fail(e); } });
    $('#hSeed').onclick = async () => { try { const k = await call('seedHolidays'); toast(k ? 'Đã thêm ' + k + ' ngày lễ' : 'Đã đủ các ngày lễ cố định', 'ok'); sHoliday(); } catch (e) { fail(e); } };
  } catch (e) { fail(e); }
}

boot();
</script>
</body>
